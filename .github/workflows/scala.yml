name: Scala CI

on:
  push:
    branches-ignore:
      - "update/**"
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scala: [2.13.18, 3.4.1]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Need the git history for sbt-dynver to determine the version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - name: Cache SBT
        uses: actions/cache@v3
        with:
          path: |
            ~/.ivy2/local/
            ~/.ivy2/cache/
            ~/.sbt/
            ~/.coursier/
          key: |
            ${{runner.os}}-java21-${{matrix.scala}}-${{hashFiles('**/*.sbt')}}
      - name: Run tests
        run: sbt ++${{ matrix.scala }} test
      - name: Publish to Maven Central Repository
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{secrets.PERSONAL_ACCESS_TOKEN}}
        if: ${{ env.GITHUB_PERSONAL_ACCESS_TOKEN != '' && github.event_name != 'pull_request' }}
        run: sbt ++${{ matrix.scala }} publishSigned sonaRelease
